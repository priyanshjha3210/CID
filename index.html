<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>CID CHASE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block}
#ov{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Courier New',monospace;background:radial-gradient(ellipse 80% 80% at 50% 60%,#1a0040 0%,#000 100%);transition:opacity .35s}
#ov.gone{opacity:0;pointer-events:none}
.badge{font-size:clamp(8px,2.2vw,11px);letter-spacing:4px;color:#ff005599;font-weight:900;margin-bottom:10px}
#logo{font-size:clamp(52px,16vw,110px);font-weight:900;line-height:.9;color:#fff;text-align:center;text-shadow:0 0 60px #ff0055,6px 6px 0 #ff0055,12px 12px 0 #aa0033;margin-bottom:6px;animation:lp 2s infinite alternate}
@keyframes lp{from{text-shadow:0 0 40px #ff0055,6px 6px 0 #ff0055,12px 12px 0 #aa0033}to{text-shadow:0 0 80px #ff0055,0 0 160px #ff005566,6px 6px 0 #ff0055,12px 12px 0 #aa0033}}
#sub{font-size:clamp(12px,3.8vw,20px);color:#ffdd00;letter-spacing:3px;font-weight:900;margin-bottom:28px;text-shadow:0 0 20px #ffdd0088;animation:bk 1.5s infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.5}}
#scores{display:none;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px}
#scores.show{display:flex}
.sr{font-size:clamp(13px,4vw,20px);font-weight:900;letter-spacing:2px;padding:6px 24px;border:2px solid}
.sr.a{color:#ff0055;border-color:#ff0055;box-shadow:0 0 15px #ff005533}
.sr.b{color:#ffdd00;border-color:#ffdd0055;font-size:clamp(10px,3vw,14px)}
#btn{font-family:'Courier New',monospace;font-weight:900;font-size:clamp(15px,4.5vw,22px);letter-spacing:4px;background:#ff0055;color:#fff;border:none;padding:clamp(13px,3.8vw,19px) clamp(36px,10vw,65px);cursor:pointer;box-shadow:5px 5px 0 #000,0 0 30px #ff005566;text-shadow:0 2px 0 #000}
#btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
#hint{margin-top:18px;font-size:clamp(8px,2.3vw,11px);color:#444;letter-spacing:2px;text-align:center;line-height:2.2}
#loading{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;color:#ff0055;font-family:'Courier New',monospace;font-size:clamp(14px,4vw,20px);font-weight:900;letter-spacing:3px}
#ad-wrap{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;width:min(320px,calc(100vw - 24px));height:50px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);box-shadow:0 0 22px rgba(0,0,0,.65);overflow:hidden;transform:translateX(-50%);transition:opacity .2s ease,transform .2s ease}
#ad-slot{width:320px;height:50px;transform-origin:center}
#ad-close{position:absolute;right:4px;top:4px;z-index:2;width:22px;height:22px;border:0;background:rgba(0,0,0,.76);color:#fff;font:900 16px/22px Arial,sans-serif;cursor:pointer}
body.playing #ad-wrap,body.ad-closed #ad-wrap{opacity:0;pointer-events:none;transform:translate(-50%,12px)}
@media(max-width:344px){#ad-slot{transform:scale(calc((100vw - 24px)/320))}}
</style>
</head>

function loadImages(cb){

let AC,pBuf,cBuf,pNode,audioOK=false;
function b2ab(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
async function initAudio(){
  if(audioOK)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')await AC.resume();
    [pBuf,cBuf]=await Promise.all([AC.decodeAudioData(b2ab(PB)),AC.decodeAudioData(b2ab(CB))]);
    audioOK=true;
  }catch(e){console.warn('audio',e);}
}
function stopBg(){if(pNode){try{pNode.stop();}catch(e){}pNode=null;}}
function playBg(){
  if(!audioOK)return;stopBg();
  pNode=AC.createBufferSource();pNode.buffer=pBuf;pNode.loop=true;
  const g=AC.createGain();g.gain.value=0.7;pNode.connect(g);g.connect(AC.destination);pNode.start(0);
}
function playCaught(){
  if(!audioOK)return;
  const s=AC.createBufferSource();s.buffer=cBuf;
  const g=AC.createGain();g.gain.value=1;s.connect(g);g.connect(AC.destination);s.start(0);
}
function sfxJump(dbl){
  if(!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type='square';
  o.frequency.setValueAtTime(dbl?170:265,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(dbl?340:530,AC.currentTime+0.1);
  g.gain.setValueAtTime(0.13,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.14);
  o.start();o.stop(AC.currentTime+0.14);}catch(e){}
}
function sfxBonk(){
  if(!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type='sawtooth';
  o.frequency.setValueAtTime(300,AC.currentTime);o.frequency.exponentialRampToValueAtTime(60,AC.currentTime+0.2);
  g.gain.setValueAtTime(0.25,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.2);
  o.start();o.stop(AC.currentTime+0.2);}catch(e){}
}
function sfxCoin(){
  if(!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type='sine';
  o.frequency.setValueAtTime(880,AC.currentTime);o.frequency.setValueAtTime(1320,AC.currentTime+0.08);
  g.gain.setValueAtTime(0.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.18);
  o.start();o.stop(AC.currentTime+0.18);}catch(e){}
}

//  WORLD COORDINATE SYSTEM
//  Everything lives in world-space X.
//  Camera X = player.wx - W/2  (player always centered)
//  screen_x = world_x - camX
// ════════════════════════════════════════════
let camX=0;
function toScreen(wx){return wx-camX;}

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let running=false,dead=false,frame=0,score=0,best=0;
let coinCount=0,shake=0,bgOff=0,nextObs=0,animId=null;

let obstacles=[],coins=[],particles=[],stars=[];

let P={};
function resetP(){

     legT:0,bob:0,bDir:1,hitFlash:0,speed:0};

let CH=[];
function resetCH(){

  CH=[
    {imgKey:'c1',wx:P.wx-gaps[0],w:S*32,h:S*39,y:GY-S*39,vy:0,jumps:0,onGround:true,legT:0,bob:0,bDir:1,wobble:0,wDir:1},
    {imgKey:'c2',wx:P.wx-gaps[1],w:S*30,h:S*37,y:GY-S*37,vy:0,jumps:0,onGround:true,legT:0,bob:0,bDir:1,wobble:0,wDir:1},
    {imgKey:'c3',wx:P.wx-gaps[2],w:S*28,h:S*35,y:GY-S*35,vy:0,jumps:0,onGround:true,legT:0,bob:0,bDir:1,wobble:0,wDir:1},
  ];
}

// ════════════════════════════════════════════
//  PHYSICS
// ════════════════════════════════════════════
const GRAV=()=>0.6*S;
const JF=()=>-14*S;

function stepVert(e){
  e.vy+=GRAV();e.y+=e.vy;
  if(e.y>=GY-e.h){e.y=GY-e.h;e.vy=0;e.jumps=0;e.onGround=true;}
  else e.onGround=false;
  e.legT+=0.4;
  if(e.onGround){e.bob+=0.22*e.bDir;if(Math.abs(e.bob)>2)e.bDir*=-1;}else e.bob=0;
  if('wobble' in e){e.wobble+=0.13*e.wDir;if(Math.abs(e.wobble)>4)e.wDir*=-1;}
}

// ════════════════════════════════════════════
//  CHASER AI — detect obstacles ahead and jump
// ════════════════════════════════════════════
function chaserAI(c, cSpd){
  if(!c.onGround)return;
  const look = cSpd*18+S*50;
  const cx = (c.screenX ?? toScreen(c.wx)) + c.w;
  for(const ob of obstacles){
    if(ob.type==='coinblock'||ob.type==='dead')continue;
    const osx = toScreen(ob.wx);
    if(osx > cx-S*4 && osx < cx+look){
      if(ob.h > S*12){ c.vy=JF(); c.jumps=1; c.onGround=false; }
      break;
    }
  }
}

// ════════════════════════════════════════════
//  OBSTACLE TYPES (Mario-style)
// ════════════════════════════════════════════
function spawnObs(){
  const wx=P.wx+W+S*30;
  const r=Math.random();
  // clusters grow with score
  const count = score>600&&r<0.25 ? 4
              : score>300&&r<0.3  ? 3
              : score>100&&r<0.38 ? 2 : 1;
  let cx=wx;
  for(let i=0;i<count;i++){
    const ob=buildObs(cx,score);
    if(ob){obstacles.push(ob);cx+=ob.w+S*(14+Math.random()*14);}
  }
  // floating coin block
  if(score>30&&Math.random()<0.32){
    obstacles.push({wx:wx+S*(Math.random()*40),y:GY-S*(110+Math.random()*40),w:S*18,h:S*18,type:'coinblock',col:'#ffaa00',coins:3});
  }
  // coin rows
  if(Math.random()<0.45) spawnCoins(wx+S*(5+Math.random()*30),GY-S*(50+Math.random()*55));
}

const OBS_TYPES=['pipe_tall','pipe_short','pipe_mid','brick_small','brick_tall','cactus','mushroom','rock','ice_block'];
function buildObs(wx,score){
  const heightMult = 1 + Math.min(0.8, score * 0.0012); // obstacles get taller over time
  const pool=score<60  ?['pipe_short','pipe_mid','brick_small','cactus']:
             score<150 ?['pipe_tall','pipe_mid','brick_small','brick_tall','cactus','mushroom']:
             score<350 ?['pipe_tall','pipe_mid','brick_tall','cactus','mushroom','rock','ice_block']:
             OBS_TYPES;
  const t=pool[Math.floor(Math.random()*pool.length)];
  if(t==='pipe_tall'){
    const h=S*(58+Math.random()*30)*heightMult,w=S*(15+Math.random()*5);
    return{wx,y:GY-h,w,h,type:'pipe',col:'#1e6b1e',col2:'#44bb44',cap:true,capH:S*11,capW:w+S*6};
  }
  if(t==='pipe_short'){
    const h=S*(20+Math.random()*14)*heightMult,w=S*(13+Math.random()*4);
    return{wx,y:GY-h,w,h,type:'pipe',col:'#1e6b1e',col2:'#44bb44',cap:true,capH:S*10,capW:w+S*5};
  }
  if(t==='pipe_mid'){
    const h=S*(36+Math.random()*18)*heightMult,w=S*(13+Math.random()*5);
    return{wx,y:GY-h,w,h,type:'pipe',col:'#1e6b1e',col2:'#44bb44',cap:true,capH:S*10,capW:w+S*5};
  }
  if(t==='brick_small'){
    const w=S*(20+Math.random()*20),h=S*(16+Math.random()*14)*heightMult;
    return{wx,y:GY-h,w,h,type:'brick',col:'#c05010',col2:'#e07830'};
  }
  if(t==='brick_tall'){
    const w=S*(12+Math.random()*10),h=S*(32+Math.random()*26)*heightMult;
    return{wx,y:GY-h,w,h,type:'brick',col:'#a04010',col2:'#d06020'};
  }
  if(t==='cactus'){
    const h=S*(24+Math.random()*18)*heightMult,w=S*(9+Math.random()*6);
    return{wx,y:GY-h,w,h,type:'cactus',col:'#1a6b1a',col2:'#3a9b3a'};
  }
  if(t==='mushroom'){
    const h=S*(22+Math.random()*12)*heightMult,w=S*(20+Math.random()*10);
    return{wx,y:GY-h,w,h,type:'mushroom',col:'#cc2200',col2:'#ff6644'};
  }
  if(t==='rock'){
    const h=S*(18+Math.random()*20)*heightMult,w=S*(16+Math.random()*16);
    return{wx,y:GY-h,w,h,type:'rock',col:'#555566',col2:'#8888aa'};
  }
  if(t==='ice_block'){
    const h=S*(18+Math.random()*14)*heightMult,w=S*(18+Math.random()*14);
    return{wx,y:GY-h,w,h,type:'ice',col:'#88ccee',col2:'#cceeff'};
  }
  return null;
}

function spawnCoins(wx,y){
  for(let i=0;i<6;i++) coins.push({wx:wx+i*S*17,y,r:S*7,collected:false,bob:Math.random()*Math.PI*2});
}

// ════════════════════════════════════════════
function puff(wx,y,col,n){
  for(let i=0;i<n;i++)
    particles.push({wx,y,vx:(Math.random()-.5)*S*4.5,vy:-Math.random()*S*3.5-S,life:1,col,sz:S*(2+Math.random()*3)});
}
function updatePart(){
  particles.forEach(p=>{p.wx+=p.vx;p.y+=p.vy;p.vy+=GRAV()*0.22;p.life-=0.042;});

}
function drawPart(){
  particles.forEach(p=>{

// ════════════════════════════════════════════
//  BACKGROUND
// ════════════════════════════════════════════
const BLDH=[42,62,35,70,52,44,66,38,58,45,68,32,60,48];
function initBg(){
  stars=[];
  for(let i=0;i<70;i++)
    stars.push({x:Math.random()*W,y:Math.random()*GY*.9,s:Math.random()*1.8+.4,tw:Math.random()*Math.PI*2});
}
function drawBg(){
  const sg=ctx.createLinearGradient(0,0,0,GY);
  sg.addColorStop(0,'#020008');sg.addColorStop(.55,'#0d0424');sg.addColorStop(1,'#180830');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,GY);
  stars.forEach(s=>{
    s.tw+=.032;
    ctx.fillStyle=`rgba(255,245,200,${.3+Math.abs(Math.sin(s.tw))*.55})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();
  });
  // city silhouette
  const bw=W/BLDH.length;
  BLDH.forEach((h,i)=>{
    const bx=((i*bw - bgOff*0.06)%W+W)%W;
    ctx.fillStyle='rgba(10,0,26,.92)';
    ctx.fillRect(bx,GY-h*S*.65,bw*.84,h*S*.65);
    for(let wy=GY-h*S*.60+S*5;wy<GY-S*3;wy+=S*10)
      for(let wx2=bx+S*3;wx2<bx+bw*.84-S*3;wx2+=S*8)
        if((Math.floor(wx2/8)+Math.floor(wy/10))%3===0){
          ctx.fillStyle='rgba(255,210,60,.09)';ctx.fillRect(wx2,wy,S*4.5,S*6);
        }
  });
  // ground
  const gg=ctx.createLinearGradient(0,GY,0,H);
  gg.addColorStop(0,'#3e1605');gg.addColorStop(.4,'#260d03');gg.addColorStop(1,'#0f0400');
  ctx.fillStyle=gg;ctx.fillRect(0,GY,W,H-GY);
  ctx.save();ctx.strokeStyle='#ff0055';ctx.lineWidth=S*2.8;
  ctx.shadowColor='#ff0055';ctx.shadowBlur=S*18;
  ctx.beginPath();ctx.moveTo(0,GY);ctx.lineTo(W,GY);ctx.stroke();ctx.restore();
  const dOff=(bgOff*.8)%(S*55);
  ctx.fillStyle='rgba(255,0,85,.1)';
  for(let x=-S*55+dOff;x<W+S*10;x+=S*55) ctx.fillRect(x,GY+S*5,S*28,S*4);
  ctx.fillStyle='rgba(255,80,0,.06)';
  for(let x=-S*55+dOff*.6;x<W+S*10;x+=S*55) ctx.fillRect(x,GY+S*13,S*18,S*3);
}

// ════════════════════════════════════════════
//  DRAW OBSTACLES
// ════════════════════════════════════════════
function drawObs(){
  obstacles.forEach(ob=>{
    const sx=toScreen(ob.wx);
    if(sx>W+S*50||sx+ob.w<-S*50)return;
    ctx.save();
    if(ob.type==='pipe'){
      const pg=ctx.createLinearGradient(sx,0,sx+ob.w,0);
      pg.addColorStop(0,'#155215');pg.addColorStop(.35,'#44bb44');pg.addColorStop(.7,'#227822');pg.addColorStop(1,'#0f3f0f');
      ctx.fillStyle=pg;ctx.shadowColor='#44bb44';ctx.shadowBlur=S*5;
      ctx.fillRect(sx,ob.y,ob.w,ob.h);
      if(ob.cap){
        const cg=ctx.createLinearGradient(sx-S*3,0,sx+ob.capW,0);
        cg.addColorStop(0,'#155a15');cg.addColorStop(.35,'#55cc44');cg.addColorStop(1,'#103510');
        ctx.fillStyle=cg;ctx.fillRect(sx-S*3,ob.y-ob.capH,ob.capW,ob.capH+S*2);
      }
      ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(sx+ob.w*.15,ob.y,ob.w*.18,ob.h);
    } else if(ob.type==='brick'){
      const bg2=ctx.createLinearGradient(sx,ob.y,sx,ob.y+ob.h);
      bg2.addColorStop(0,ob.col2);bg2.addColorStop(1,ob.col);
      ctx.fillStyle=bg2;ctx.shadowColor=ob.col;ctx.shadowBlur=S*3;
      ctx.fillRect(sx,ob.y,ob.w,ob.h);
      ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=S*1.5;
      for(let sy=ob.y;sy<ob.y+ob.h;sy+=S*9){ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+ob.w,sy);ctx.stroke();}
      let off=0;
      for(let sy=ob.y;sy<ob.y+ob.h;sy+=S*9,off=1-off)
        for(let cx2=sx+(off?S*7:0);cx2<sx+ob.w;cx2+=S*14){ctx.beginPath();ctx.moveTo(cx2,sy);ctx.lineTo(cx2,sy+S*9);ctx.stroke();}
      ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(sx,ob.y,ob.w,S*3);
    } else if(ob.type==='cactus'){
      ctx.fillStyle=ob.col2;ctx.shadowColor='#44bb44';ctx.shadowBlur=S*5;
      ctx.fillRect(sx,ob.y,ob.w,ob.h);
      // arms
      ctx.fillRect(sx-ob.w*.6,ob.y+ob.h*.3,ob.w*.6,S*5);
      ctx.fillRect(sx+ob.w,ob.y+ob.h*.45,ob.w*.6,S*5);
      ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(sx+ob.w*.3,ob.y,ob.w*.2,ob.h);
    } else if(ob.type==='mushroom'){
      // stem
      ctx.fillStyle='#ddccaa';ctx.fillRect(sx+ob.w*.25,ob.y+ob.h*.55,ob.w*.5,ob.h*.45);
      // cap
      ctx.fillStyle=ob.col2;ctx.shadowColor=ob.col;ctx.shadowBlur=S*6;
      ctx.beginPath();ctx.arc(sx+ob.w/2,ob.y+ob.h*.45,ob.w*.6,Math.PI,0);ctx.closePath();ctx.fill();
      ctx.fillStyle=ob.col;ctx.beginPath();ctx.arc(sx+ob.w/2,ob.y+ob.h*.45,ob.w*.6,Math.PI,0);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.6)';
      ctx.beginPath();ctx.arc(sx+ob.w*.3,ob.y+ob.h*.3,ob.w*.12,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+ob.w*.65,ob.y+ob.h*.35,ob.w*.08,0,Math.PI*2);ctx.fill();
    } else if(ob.type==='rock'){
      const rg=ctx.createLinearGradient(sx,ob.y,sx+ob.w,ob.y+ob.h);
      rg.addColorStop(0,ob.col2);rg.addColorStop(1,ob.col);
      ctx.fillStyle=rg;ctx.shadowColor=ob.col2;ctx.shadowBlur=S*3;
      ctx.beginPath();ctx.moveTo(sx+ob.w*.15,ob.y+ob.h);ctx.lineTo(sx,ob.y+ob.h*.55);
      ctx.lineTo(sx+ob.w*.2,ob.y+ob.h*.05);ctx.lineTo(sx+ob.w*.8,ob.y);
      ctx.lineTo(sx+ob.w,ob.y+ob.h*.4);ctx.lineTo(sx+ob.w*.85,ob.y+ob.h);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.15)';
      ctx.beginPath();ctx.moveTo(sx+ob.w*.2,ob.y+ob.h*.1);ctx.lineTo(sx+ob.w*.55,ob.y+ob.h*.08);
      ctx.lineTo(sx+ob.w*.35,ob.y+ob.h*.35);ctx.closePath();ctx.fill();
    } else if(ob.type==='ice'){
      const ig=ctx.createLinearGradient(sx,ob.y,sx+ob.w,ob.y+ob.h);
      ig.addColorStop(0,ob.col2);ig.addColorStop(1,ob.col);
      ctx.fillStyle=ig;ctx.shadowColor='#aaeeff';ctx.shadowBlur=S*8;
      ctx.fillRect(sx,ob.y,ob.w,ob.h);
      ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=S*1;
      ctx.strokeRect(sx+S*2,ob.y+S*2,ob.w-S*4,ob.h-S*4);
      ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(sx+S*3,ob.y+S*3,ob.w*.35,ob.h*.35);
    } else if(ob.type==='coinblock'){
      const qg=ctx.createLinearGradient(sx,ob.y,sx,ob.y+ob.h);
      qg.addColorStop(0,'#ffcc44');qg.addColorStop(1,'#aa7700');
      ctx.fillStyle=qg;ctx.shadowColor='#ffdd00';ctx.shadowBlur=S*9;
      ctx.fillRect(sx,ob.y,ob.w,ob.h);
      ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=S*2;ctx.strokeRect(sx,ob.y,ob.w,ob.h);
      ctx.fillStyle='rgba(0,0,0,.3)';ctx.font=`bold ${S*11}px Courier New`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('?',sx+ob.w/2,ob.y+ob.h/2);
      ctx.textAlign='left';ctx.textBaseline='alphabetic';
    }
    ctx.restore();
  });
}

function drawEnt(e, isP){
  const sx = isP ? W/2 - P.w/2 : (e.screenX ?? toScreen(e.wx));

  ctx.save();ctx.globalAlpha=.2;ctx.fillStyle='#000';

  // sprite
  ctx.save();ctx.translate(sx+e.w/2,e.y+e.h/2+e.bob);

  } else {
    ctx.fillStyle=isP?'#ffaa00':'#ff4444';
    ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);

  if(!isP){
    ctx.save();ctx.globalAlpha=.05+Math.abs(Math.sin(frame*.08))*.07;ctx.fillStyle='#ff2200';
    ctx.fillRect(sx-S*3,e.y-S*2,e.w+S*6,e.h+S*4);ctx.restore();
  }
}

function rrect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function doJump(){
  if(!running)return;
  if(P.jumps<2){
    const dbl=P.jumps===1;
    P.vy=JF()+(dbl?S*1.5:0);P.jumps++;P.onGround=false;

function hitR(ax,ay,aw,ah,bx,by,bw,bh,mx,my){
  mx=mx??S*4;my=my??S*4;
  return ax+mx<bx+bw-mx&&ax+aw-mx>bx+mx&&ay+my<by+bh-my&&ay+ah-my>by+my;
}

// Keep third-party ads out of the active game loop.
const AD_KEY='e4597720f7ceeecbe1bda9e5f182b8b3';

async function startGame(){

  const ov=document.getElementById('ov');
  ov.classList.add('gone');setTimeout(()=>ov.style.display='none',400);
  resize();initBg();
  running=true;dead=false;frame=0;score=0;coinCount=0;blocked=false;bonkTimer=0;shake=0;bgOff=0;

}

// ════════════════════════════════════════════
//  MAIN LOOP
// ════════════════════════════════════════════
function loop(){
  if(!running)return;
  frame++;

  // ── base speed scales aggressively with score ──
  const baseSpd = S * Math.min(22, 4.5 + Math.pow(score / 45, 1.55) * 1.1);

  // ── VERTICAL PHYSICS for player ──
  stepVert(P);
  if(P.hitFlash>0)P.hitFlash=Math.max(0,P.hitFlash-.05);

  // ── CHECK BLOCKED: is there a solid obstacle directly in front of player? ──
  // In world space: player right edge = P.wx + P.w
  // Obstacle blocks if its left edge is near player right edge AND vertically overlapping
  blocked=false;
  const pRight=P.wx+P.w;
  const pTop=P.y+S*7;
  const pBot=P.y+P.h-S*5;
  for(const ob of obstacles){
    if(ob.type==='coinblock'||ob.type==='dead')continue;
    const obLeft=ob.wx;
    const obRight=ob.wx+ob.w;
    const obTop=ob.y+S*5;
    const obBot=ob.y+ob.h;
    // obstacle overlaps player's right side and player hasn't jumped over it
    if(obLeft<=pRight+S*3 && obLeft>=P.wx-S*5 && pBot>obTop && pTop<obBot){
      blocked=true;
      // hard-clamp: player cannot move into obstacle
      P.wx=obLeft-P.w;
      break;
    }
  }

  // ── PLAYER WORLD MOVEMENT ──
  if(!blocked){
    P.speed=Math.min(baseSpd, (P.speed||S*5)+S*0.15);
    P.wx+=P.speed;
    score=Math.floor((P.wx-1000)/80);  // score based on distance run
    bgOff+=P.speed;
  } else {
    P.speed=0;
    bonkTimer++;
    if(bonkTimer===1){sfxBonk();puff(P.wx+P.w,P.y+P.h/2,'#ff4400',10);shake=Math.max(shake,12);}
    P.hitFlash=Math.min(1,P.hitFlash+0.06);
    bgOff+=0; // world pauses visually
  }

  // update camera — player always at center
  camX=P.wx-W/2+P.w/2;

  // spawn obstacles — gap shrinks and clusters grow with score
  nextObs--;
  if(nextObs<=0){
    spawnObs();
    const minGap = Math.max(S*22, S*90 - score * S*0.18);
    const randExtra = Math.max(S*10, S*35 - score * S*0.08);
    nextObs = Math.floor(minGap + Math.random() * randExtra);
  }

  // cleanup: obstacles behind camera
  obstacles=obstacles.filter(o=>o.wx>camX-S*120&&o.type!=='dead');
  coins=coins.filter(c=>c.wx>camX-S*60&&!c.collected);

  // ── CHASERS — screen-relative lag behind player ──
  // Each chaser has a `lag` = pixels to the LEFT of the player on screen.
  // When player runs free: lag stays ~constant (chasers keep up).
  // When player blocked: lag shrinks every frame → chasers walk into player.
  const cSpd = baseSpd * 0.90 + S * 0.3;
  const psx = W / 2 - P.w / 2; // player screen x (always center)
  CH.forEach((c, i) => {
    if (c.lag === undefined) c.lag = W * 0.24 * (i + 1); // init
    if (blocked) {
      // player stopped → chasers close in unconditionally
      c.lag = Math.max(0, c.lag - cSpd);
    } else {
      // player running → slowly converge toward ideal gap
      const ideal = W * (0.22 - Math.min(0.07, score * 0.000085)) * (i + 1);
      if (c.lag > ideal) c.lag -= Math.min(S * 0.6, c.lag - ideal);
      else c.lag += Math.min(S * 0.4, ideal - c.lag);
    }
    c.screenX = psx - c.lag;
    // vertical AI — look for obstacles at chaser screen pos
    chaserAI(c, cSpd / S);
    stepVert(c);
  });

  // ── COIN PICKUP ──
  coins.forEach(c=>{
    if(c.collected)return;
    const sx=toScreen(c.wx);
    if(hitR(W/2-P.w/2,P.y,P.w,P.h,sx,c.y-c.r,c.r*2,c.r*2,0,0)){
      c.collected=true;coinCount++;puff(c.wx,c.y,'#ffdd00',8);sfxCoin();
    }
  });
  // coinblock bump
  for(const ob of obstacles){
    if(ob.type==='coinblock'){
      const sx=toScreen(ob.wx);
      if(hitR(W/2-P.w/2,P.y,P.w,P.h,sx,ob.y,ob.w,ob.h,0,0)){
        coinCount+=(ob.coins||1);puff(ob.wx+ob.w/2,ob.y,'#ffdd00',12);ob.type='dead';sfxCoin();
      }
    }
  }

  // ── GAME OVER: chaser touches player ──
  const psx2 = W/2 - P.w/2;
  for(const c of CH){
    const csx = c.screenX ?? toScreen(c.wx);
    if(hitR(psx2,P.y,P.w,P.h,csx,c.y,c.w,c.h,S*3,S*3)){
      gameOver();return;
    }
  }

  updatePart();

  // ── RENDER ──
  let ox=0,oy=0;
  if(shake>0){ox=(Math.random()-.5)*shake;oy=(Math.random()-.5)*shake;shake-=2;}
  ctx.save();ctx.translate(ox,oy);
  drawBg();drawObs();drawCoins();drawPart();
  for(let i=CH.length-1;i>=0;i--) drawEnt(CH[i],false);
  drawEnt(P,true);
  drawHUD();
  ctx.restore();

  animId=requestAnimationFrame(loop);
}

// ════════════════════════════════════════════
//  MENU BACKGROUND LOOP
// ════════════════════════════════════════════
function drawMenuBg(){
  resize();initBg();
  (function ml(){
    if(running)return;
    bgOff+=1.5;drawBg();requestAnimationFrame(ml);
  })();
}

loadImages(()=>{
  document.getElementById('loading').style.display='none';
  const ov=document.getElementById('ov');
  ov.style.display='flex';requestAnimationFrame(()=>ov.classList.remove('gone'));
  drawMenuBg();
  scheduleAd();
});
</script>
